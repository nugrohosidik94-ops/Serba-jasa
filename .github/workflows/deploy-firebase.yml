name: Deploy Firebase (functions)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: serba-jasa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi functions
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Login ke Firebase (service account)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Parameter functions
        env:
          CK: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          ME: ${{ secrets.MIDTRANS_ENV }}
          SU: ${{ secrets.SITE_URL }}
        run: |
          {
            echo "MIDTRANS_CLIENT_KEY=$CK"
            echo "MIDTRANS_ENV=${ME:-sandbox}"
            [ -n "$SU" ] && echo "SITE_URL=$SU"
          } > functions/.env
          true

      - name: Simpan Server Key Midtrans ke Secret Manager
        env:
          SK: ${{ secrets.MIDTRANS_SERVER_KEY }}
        run: printf '%s' "$SK" | npx --yes firebase-tools functions:secrets:set MIDTRANS_SERVER_KEY --data-file=- --project "$PROJECT" --force --non-interactive

      - name: Deploy functions
        run: npx --yes firebase-tools deploy --only functions --project "$PROJECT" --force --non-interactive
